name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + int)
        run: pnpm test
        env:
          DATABASE_URI: postgresql://pulse:pulse@localhost:5432/pulse_cms
          PAYLOAD_SECRET: ci-secret-not-real

      - name: Build
        run: pnpm build
        env:
          DATABASE_URI: postgresql://pulse:pulse@localhost:5432/pulse_cms
          PAYLOAD_SECRET: ci-secret-not-real

  e2e:
    name: E2E
    needs: checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          DATABASE_URI: postgresql://pulse:pulse@localhost:5432/pulse_cms
          PAYLOAD_SECRET: ci-secret-not-real

      # This job's Postgres service starts with no schema, and `next start`
      # runs in production mode where Payload's dev-mode schema push is
      # disabled (see @payloadcms/db-postgres connect.js). Schema now comes
      # from committed migrations (src/migrations), not seed side effects —
      # run them before seeding.
      - name: Run migrations
        run: pnpm migrate
        env:
          DATABASE_URI: postgresql://pulse:pulse@localhost:5432/pulse_cms
          PAYLOAD_SECRET: ci-secret-not-real

      # Creates the super-admin and the two seed `sites` records the e2e
      # smoke spec expects to exist before `pnpm start` boots the server
      # under test.
      - name: Seed database
        run: pnpm seed
        env:
          DATABASE_URI: postgresql://pulse:pulse@localhost:5432/pulse_cms
          PAYLOAD_SECRET: ci-secret-not-real

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          DATABASE_URI: postgresql://pulse:pulse@localhost:5432/pulse_cms
          PAYLOAD_SECRET: ci-secret-not-real

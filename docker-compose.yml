services:
  postgres:
    image: postgres:17-alpine
    container_name: pulse-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse_cms
    ports:
      - '5432:5432'
    volumes:
      - pulse-cms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulse -d pulse_cms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pulse-cms-db-data:
